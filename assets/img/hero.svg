<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#072430"/>
      <stop offset="0.42" stop-color="#0f4453"/>
      <stop offset="0.72" stop-color="#2b7f8c"/>
      <stop offset="1" stop-color="#d8b981"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d68a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e2a94a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e2a94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5f70"/>
      <stop offset="0.5" stop-color="#0f4150"/>
      <stop offset="1" stop-color="#082b36"/>
    </linearGradient>
    <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20140c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1e25" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sunPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf8c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f3cf8c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- sun & glow -->
  <circle cx="1130" cy="470" r="330" fill="url(#sunGlow)"/>
  <circle cx="1130" cy="470" r="86" fill="#f7dc9b" opacity="0.92" filter="url(#soft)"/>
  <circle cx="1130" cy="470" r="58" fill="#fdf0cf" opacity="0.95"/>

  <!-- distant hills -->
  <path d="M0 520 C 180 470 320 500 470 486 C 640 470 760 500 900 492 C 1080 482 1250 508 1600 484 L1600 560 L0 560 Z"
        fill="#0a3341" opacity="0.85"/>

  <!-- sea -->
  <rect y="540" width="1600" height="460" fill="url(#sea)"/>
  <path d="M0 540 H1600 V575 C 1400 566 1280 585 1140 576 C 1000 567 880 588 740 578 C 600 568 460 590 300 578 C 180 569 90 583 0 576 Z"
        fill="#0d3d4b" opacity="0.9"/>

  <!-- sun reflection -->
  <path d="M1130 560 C 1090 660 1060 760 1030 1000 L1230 1000 C 1200 760 1170 660 1130 560 Z"
        fill="url(#sunPath)"/>

  <!-- wave lines -->
  <g stroke="#8fc4cf" stroke-opacity="0.26" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M-40 636 C 120 622 240 650 400 636 C 560 622 680 648 840 634 C 1000 620 1120 646 1280 632 C 1400 622 1520 642 1660 630"/>
    <path d="M-60 706 C 100 692 220 720 380 706 C 540 692 660 718 820 704 C 980 690 1100 716 1260 702 C 1380 692 1500 712 1640 700"/>
    <path d="M-40 790 C 120 778 240 804 400 790 C 560 776 680 802 840 788 C 1000 774 1120 800 1280 786 C 1400 776 1520 796 1660 784"/>
    <path d="M-80 886 C 80 874 200 900 360 886 C 520 872 640 898 800 884 C 960 870 1080 896 1240 882 C 1360 872 1480 892 1620 880"/>
  </g>

  <!-- small boat -->
  <g fill="#081f27" opacity="0.8" transform="translate(300 596)">
    <path d="M0 12 L70 12 L58 26 L12 26 Z"/>
    <path d="M34 12 L34 -26 L52 10 Z" opacity="0.9"/>
    <path d="M30 12 L30 -18 L16 10 Z" opacity="0.7"/>
  </g>

  <!-- foreground promenade & palm silhouettes -->
  <path d="M0 1000 L0 902 C 220 884 420 906 620 894 C 860 880 1060 906 1280 892 C 1420 884 1540 898 1600 892 L1600 1000 Z"
        fill="url(#sandG)"/>
  <g fill="#04161c" opacity="0.9">
    <!-- palm 1 -->
    <path d="M1204 900 C 1198 860 1196 820 1200 786 L1208 786 C 1212 824 1212 862 1216 900 Z"/>
    <g transform="translate(1204 786)">
      <path d="M0 0 C -30 -26 -62 -34 -92 -22 C -64 -46 -30 -44 0 -16 Z"/>
      <path d="M0 0 C -26 -44 -18 -74 6 -92 C -14 -68 -18 -38 -6 -8 Z"/>
      <path d="M0 0 C 20 -44 50 -60 84 -56 C 50 -70 18 -50 2 -16 Z"/>
      <path d="M0 0 C 34 -18 68 -14 92 6 C 62 -6 30 -6 2 6 Z"/>
      <path d="M0 0 C -40 6 -68 24 -80 52 C -58 24 -28 8 0 8 Z"/>
    </g>
    <!-- palm 2 -->
    <path d="M1420 906 C 1414 872 1412 840 1416 812 L1423 812 C 1426 842 1426 874 1430 906 Z"/>
    <g transform="translate(1419 812) scale(0.78)">
      <path d="M0 0 C -30 -26 -62 -34 -92 -22 C -64 -46 -30 -44 0 -16 Z"/>
      <path d="M0 0 C -26 -44 -18 -72 6 -90 C -14 -66 -18 -38 -6 -8 Z"/>
      <path d="M0 0 C 20 -44 50 -58 82 -54 C 50 -68 18 -50 2 -16 Z"/>
      <path d="M0 0 C 32 -18 64 -14 88 6 C 60 -6 30 -6 2 6 Z"/>
    </g>
  </g>

  <!-- terrace string lights -->
  <g stroke="#f3cf8c" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M60 830 C 300 878 620 890 900 858"/>
  </g>
  <g fill="#fbe6b4" fill-opacity="0.85">
    <circle cx="150" cy="851" r="4"/><circle cx="300" cy="866" r="4"/>
    <circle cx="460" cy="876" r="4"/><circle cx="620" cy="879" r="4"/>
    <circle cx="780" cy="872" r="4"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="1000" fill="none"/>
</svg>
